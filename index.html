    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Fonts load async so they never block the first paint (swap applies
         once the stylesheet arrives) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap"

      media="print"
      onload="this.media='all'"
    />
    <noscript>

        rel="stylesheet"
      />
    </noscript>

    <!-- Replain live-chat widget — lazy-loads after first interaction or idle,
         so it never competes with the first paint -->
    <script>
      window.replainSettings = { id: 'c6366b02-2531-4ee7-b3e1-7cc6f93d7e57' };
      (function () {
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          cleanup();
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://widget.replain.cc/dist/client.js';
          var x = document.getElementsByTagName('script')[0];
          x.parentNode.insertBefore(s, x);
        }
        var evts = ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'];
        function onEvent() { load(); }
        function cleanup() {
          for (var i = 0; i < evts.length; i++) window.removeEventListener(evts[i], onEvent);
          if ('cancelIdleCallback' in window) window.cancelIdleCallback(idleId);
          else clearTimeout(idleId);
        }
        for (var i = 0; i < evts.length; i++) window.addEventListener(evts[i], onEvent, { passive: true });
        var idleId = ('requestIdleCallback' in window)
          ? window.requestIdleCallback(load, { timeout: 6000 })
          : setTimeout(load, 6000);
      })();
    </script>
  </head>
